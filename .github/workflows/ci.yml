name: CI

on:
  push:
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: political_watchtower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # No 5432/5433 port-conflict concern here — GitHub-hosted runners
      # don't have a pre-existing Postgres, unlike local dev (see
      # docker-compose.yml and .env.example for why local dev uses 5433).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/political_watchtower

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      # Snapshot chain is internally consistent...
      - run: npm run db:check
      # ...and the committed migrations match src/db/schema/*.ts: a schema
      # edit with no regenerated migration makes generate emit a new file,
      # which shows up here as an untracked/changed path. (Not `git diff`,
      # which ignores untracked files.)
      - name: Migrations are up to date with the schema
        run: |
          npm run db:generate
          test -z "$(git status --porcelain src/db/migrations)" || {
            echo "::error::Schema and migrations have drifted — regenerate (see CLAUDE.md)."
            git status --porcelain src/db/migrations
            exit 1
          }
      # Tests create and migrate their own <name>_test database; see
      # vitest.global-setup.mts.
      - run: npm run test
      - run: npm run build
